<style>
/* Layout: masthead with stamp date, then one block per team (next match → table → results → fixtures); two columns on wide screens */
:root {
  --bg: #f3f6f1;
  --surface: #ffffff;
  --fg: #16231a;
  --muted: #5d6d61;
  --line: #d9e2d8;
  --pitch: #1f7a3d;
  --pitch-soft: #e3f1e6;
  --win: #1f7a3d;
  --draw: #8a7a1c;
  --loss: #b23a2b;
  --us-row: #eaf5ec;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #172119; --fg: #e5ede6; --muted: #98a89b; --line: #2a3a2e;
    --pitch: #5cc47c; --pitch-soft: #1d3324; --win: #5cc47c; --draw: #d4c05a; --loss: #ef7d6d; --us-row: #1d3324;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #172119; --fg: #e5ede6; --muted: #98a89b; --line: #2a3a2e;
  --pitch: #5cc47c; --pitch-soft: #1d3324; --win: #5cc47c; --draw: #d4c05a; --loss: #ef7d6d; --us-row: #1d3324;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 3px solid var(--pitch); padding-bottom: 14px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 4px 0 0; text-wrap: balance; text-transform: uppercase; letter-spacing: .01em; }
.stamp { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--pitch); border: 2px solid var(--pitch); border-radius: 4px; padding: 4px 10px; white-space: nowrap; }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 32px; }
.team { display: grid; gap: 18px; align-content: start; min-width: 0; }
.team-head { display: flex; flex-direction: column; gap: 6px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 30px; margin: 0; line-height: 1; text-transform: uppercase; }
.comp { color: var(--muted); font-size: 14px; }
.comp a { color: inherit; }
.next { background: var(--pitch); color: #fff; border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; }
.next .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.next .vs { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.next .when { font-size: 15px; opacity: .92; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .next { color: #0f1612; } }
:root[data-theme="dark"] .next { color: #0f1612; }
h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
td.name, th.name { text-align: left; white-space: normal; }
tr:last-child td { border-bottom: 0; }
tr.us td { background: var(--us-row); font-weight: 700; }
td.pts { font-family: var(--display); font-weight: 700; font-size: 19px; }
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.m { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.m:last-child { border-bottom: 0; }
.date { font-size: 13px; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
.teams-txt { min-width: 0; }
.teams-txt b { font-weight: 700; }
.ha { font-size: 12px; color: var(--muted); }
.score { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.pill { font-family: var(--body); font-size: 12px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--bg); }
.pill.V { background: var(--win); } .pill.R { background: var(--draw); } .pill.P { background: var(--loss); }
.time { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 4px; }
footer { color: var(--muted); font-size: 14px; display: grid; gap: 6px; max-width: 75ch; }
footer a { color: var(--pitch); }
</style>

const NOTES = ["Zápas Kralupy U8 – Jeviněves (4. 10.) je na fotbal.cz zapsaný 0:0, počítán jako remíza."];

const DAYS = ["ne","po","út","st","čt","pá","so"];
const fmtDate = d => { const x = new Date(d + "T12:00:00"); return `${DAYS[x.getDay()]} ${x.getDate()}. ${x.getMonth()+1}.`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function standings(matches) {
  const t = {};
  const row = n => t[n] ??= { name: n, z: 0, v: 0, r: 0, p: 0, gf: 0, ga: 0, pts: 0 };
  for (const [, , h, a, hg, ag] of matches) {
    row(h); row(a);
    if (hg === null) continue;
    for (const [me, gf, ga] of [[h, hg, ag], [a, ag, hg]]) {
      const r = t[me];
      r.z++; r.gf += gf; r.ga += ga;
      if (gf > ga) { r.v++; r.pts += 3; } else if (gf === ga) { r.r++; r.pts += 1; } else r.p++;
    }
  }
  return Object.values(t).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

function render(g) {
  const ours = g.matches.filter(m => m[2] === g.team || m[3] === g.team).sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]));
  const played = ours.filter(m => m[4] !== null);
  const upcoming = ours.filter(m => m[4] === null);
  const res = m => { const home = m[2] === g.team; const f = home ? m[4] : m[5], a = home ? m[5] : m[4]; return f > a ? "V" : f === a ? "R" : "P"; };
  const opp = m => m[2] === g.team ? m[3] : m[2];
  const next = upcoming[0];
  const table = standings(g.matches);

  return `<section class="team" id="${g.id}">
    <div class="team-head">
      <h2>${esc(g.label)}</h2>
      <div class="comp"><a href="${g.url}" target="_blank" rel="noopener">${esc(g.comp)}</a></div>
    </div>
    ${next ? `<div class="next">
      <div class="lbl">Další zápas · ${next[2] === g.team ? "doma" : "venku"}</div>
      <div class="vs">${esc(next[2])} – ${esc(next[3])}</div>
      <div class="when">${fmtDate(next[0])} v ${next[1]}</div>
    </div>` : ""}
    <div>
      <h3>Tabulka</h3>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th class="name">Družstvo</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>Body</th></tr></thead>
        <tbody>${table.map((r, i) => `<tr class="${r.name === g.team ? "us" : ""}">
          <td>${i + 1}.</td><td class="name">${esc(r.name)}</td><td>${r.z}</td><td>${r.v}</td><td>${r.r}</td><td>${r.p}</td>
          <td>${r.gf}:${r.ga}</td><td class="pts">${r.pts}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div>
      <h3>Naše výsledky</h3>
      <div class="list">${played.map(m => `<div class="m">
        <div class="date">${fmtDate(m[0])}</div>
        <div class="teams-txt">${m[2] === g.team ? `<b>${esc(m[2])}</b> – ${esc(m[3])}` : `${esc(m[2])} – <b>${esc(m[3])}</b>`}</div>
        <div class="score">${m[4]}:${m[5]} <span class="pill ${res(m)}" title="${{V:"výhra",R:"remíza",P:"prohra"}[res(m)]}">${res(m)}</span></div>
      </div>`).join("")}</div>
    </div>
    <div>
      <h3>Zbývající zápasy</h3>
      <div class="list">${upcoming.map(m => `<div class="m">
        <div class="date">${fmtDate(m[0])}</div>
        <div class="teams-txt">${esc(opp(m))} <span class="ha">${m[2] === g.team ? "doma" : "venku"}</span></div>
        <div class="time">${m[1]}</div>
      </div>`).join("")}</div>
    </div>
  </section>`;
}
